name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      MOCK_AI_MODE: "true"
      ENABLE_EXTERNAL_AI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run guardrails
      - run: npm run generate:local-report
